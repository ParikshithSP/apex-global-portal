<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>HOD Console | Apex Global Search</title>
<link rel="icon" href="/assets/img/favicon-32.png" type="image/png">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/portal-kit/portal.css">
</head>
<body class="hod">
<div class="topbar"><button data-menu aria-label="Open menu">☰</button><strong>Apex Global Search · HOD</strong></div>
<div class="scrim"></div>
<div class="shell">
  <aside class="side">
    <div class="logo-badge-p"><img class="portal-logo" src="/assets/img/logo-400.png" alt="Apex Global Search"></div><div class="side-label">HOD CONSOLE</div>
    <nav>
      <a href="#home" data-r="home">🏠 Home</a>
      <a href="#requests" data-r="requests">🛂 Admin requests <span class="count" id="cPend" hidden></span></a>
      <a href="#admins" data-r="admins">👥 HR Admin accounts</a>
      <a href="#activity" data-r="activity">🧾 Activity log</a>
      <a href="#hods" data-r="hods">🎓 HOD members</a>
      <a href="#profile" data-r="profile">👤 My profile</a>
    </nav>
    <div class="who"><strong id="whoName">…</strong><span id="whoEmail" class="small"></span><button class="btn btn-sm" id="logout">Log out</button></div>
  </aside>
  <main class="main" id="view"><div class="empty">Loading…</div></main>
</div>
<script src="/portal-kit/portal.js"></script>
<script src="/hod/app.js"></script>
</body>
</html>
